{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Paid Marketing Performance</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/semantic-ui@2.5.0/dist/semantic.min.css">
</head>
<body style="background:#313E4F;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0">

  <div class="ui card" style="width:380px">
    <div class="content" style="text-align:center;padding:2em 2em 1em">
      <img src="{% static 'img/logo.avif' %}" alt="Logo" style="width:120px;margin-bottom:1em">
      <h2 class="ui header" style="margin-top:0">Paid Marketing Performance</h2>
    </div>
    <div class="content">
      {% if form.errors %}
      <div class="ui error message" style="display:block">
        <i class="exclamation triangle icon"></i> Invalid username or password.
      </div>
      {% endif %}

      <form method="post" class="ui form">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">
        <div class="field">
          <label>Username</label>
          <div class="ui left icon input">
            <i class="user icon"></i>
            <input type="text" name="username" placeholder="Username" autofocus required>
          </div>
        </div>
        <div class="field">
          <label>Password</label>
          <div class="ui left icon input">
            <i class="lock icon"></i>
            <input type="password" name="password" placeholder="Password" required>
          </div>
        </div>
        <button type="submit" class="ui primary fluid button" style="margin-top:1em">
          <i class="sign in icon"></i> Log In
        </button>
      </form>
    </div>
  </div>

</body>
</html>
